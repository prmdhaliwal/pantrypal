services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pantrypal-backend
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: pantrypal-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
